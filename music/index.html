<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Musik Player</title>
  <meta name="description" content="Aplikasi musik sederhana: upload lagu, buat playlist, dan nikmati visualizer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Material+Symbols+Outlined:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="material-symbols-outlined">music_note</span>
        <h1>Musik Player</h1>
      </div>
      <div class="actions">
        <label class="btn primary">
          <span class="material-symbols-outlined">upload</span>
          Tambah Lagu
          <input id="file-input" type="file" accept="audio/*" multiple hidden>
        </label>
        <button id="clear-playlist" class="btn ghost">
          <span class="material-symbols-outlined">delete</span>
          Bersihkan
        </button>
      </div>
    </header>

    <main class="main">
      <section class="now-playing">
        <div class="artwork" id="artwork">
          <span class="material-symbols-outlined">album</span>
        </div>
        <div class="track-info">
          <div id="track-title" class="title">Tidak ada lagu</div>
          <div id="track-artist" class="artist">—</div>
        </div>
      </section>

      <section class="controls">
        <div class="transport">
          <button id="prev" class="icon-btn" title="Sebelumnya"><span class="material-symbols-outlined">skip_previous</span></button>
          <button id="play" class="icon-btn lg" title="Putar / Jeda"><span id="play-icon" class="material-symbols-outlined">play_arrow</span></button>
          <button id="next" class="icon-btn" title="Berikutnya"><span class="material-symbols-outlined">skip_next</span></button>
        </div>

        <div class="seek">
          <span id="current-time" class="time">0:00</span>
          <input id="seek" type="range" min="0" max="100" value="0" step="0.1">
          <span id="duration" class="time">0:00</span>
        </div>

        <div class="volume">
          <button id="mute" class="icon-btn" title="Bisukan"><span id="mute-icon" class="material-symbols-outlined">volume_up</span></button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
        </div>
      </section>

      <section class="visualizer">
        <canvas id="viz"></canvas>
      </section>

      <section class="playlist">
        <h2>Playlist</h2>
        <ul id="playlist-list" class="list"></ul>
      </section>
    </main>
  </div>

  <audio id="audio"></audio>
  <script src="./app.js"></script>
</body>
</html>
